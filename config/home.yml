- name: Home
  hide-desktop-navigation: true
  columns:
    - size: small
      widgets:
        - type: clock
          hour-format: 12h
          timezones:
            - timezone: Asia/Tokyo
              label: Tokyo
            - timezone: America/New_York
              label: New York
            - timezone: Europe/London
              label: London

        - type: calendar
          first-day-of-week: sunday

        - type: weather
          location: Manila, Philippines
          units: metric
          hour-format: 12h

        - type: markets
          markets:
            - symbol: PSEI.PS
              name: PSEi
            - symbol: PHP=X
              name: USD/PHP
            - symbol: SPY
              name: S&P 500
            - symbol: BTC-USD
              name: Bitcoin
            - symbol: NVDA
              name: NVIDIA

    - size: full
      widgets:
        - type: search
          search-engine: google
          autofocus: true
          bangs:
            - title: YouTube
              shortcut: "!yt"
              url: https://www.youtube.com/results?search_query={QUERY}
            - title: GitHub
              shortcut: "!gh"
              url: https://github.com/search?q={QUERY}

        - type: bookmarks
          groups:
            - title: Daily
              links:
                - title: Gmail
                  url: https://mail.google.com/mail/u/0/
                - title: Calendar
                  url: https://calendar.google.com/
                - title: Drive
                  url: https://drive.google.com/
                - title: Facebook
                  url: https://www.facebook.com/
                - title: Messenger
                  url: https://www.messenger.com/
                - title: Reddit
                  url: https://www.reddit.com/
                - title: YouTube
                  url: https://www.youtube.com/
            - title: AI
              links:
                - title: Claude
                  url: https://claude.ai/
                - title: ChatGPT
                  url: https://chatgpt.com/
                - title: Gemini
                  url: https://gemini.google.com/
            - title: Dev
              links:
                - title: GitHub
                  url: https://github.com/
                - title: Vercel
                  url: https://vercel.com/dashboard
                - title: Fly.io
                  url: https://fly.io/dashboard
            - title: News & Reading
              links:
                - title: Hacker News
                  url: https://news.ycombinator.com/
                - title: Rappler
                  url: https://www.rappler.com/
                - title: The Verge
                  url: https://www.theverge.com/
            - title: Entertainment
              links:
                - title: Netflix
                  url: https://www.netflix.com/
                - title: Spotify
                  url: https://open.spotify.com/
                - title: Movy
                  url: https://movy.sx/
                - title: Rivestream
                  url: https://rivestream.app/
                - title: Weeb Central
                  url: https://weebcentral.com/
                - title: HiveToons
                  url: https://hivetoons.org/
            - title: Learning
              links:
                - title: Udemy
                  url: https://www.udemy.com/
                - title: Tutorials Dojo
                  url: https://portal.tutorialsdojo.com/
                - title: Cantrill
                  url: https://learn.cantrill.io/
                - title: freeCodeCamp
                  url: https://www.freecodecamp.org/
                - title: Khan Academy
                  url: https://www.khanacademy.org/
                - title: Wikipedia
                  url: https://www.wikipedia.org/
            - title: Tools
              links:
                - title: Canva
                  url: https://www.canva.com/
                - title: Figma
                  url: https://www.figma.com/
                - title: TinyPNG
                  url: https://tinypng.com/
                - title: Sejda PDF
                  url: https://www.sejda.com/
                - title: Photopea
                  url: https://www.photopea.com/
                - title: CloudConvert
                  url: https://cloudconvert.com/
                - title: Excalidraw
                  url: https://excalidraw.com/

        - type: group
          widgets:
            - type: hacker-news
            - type: lobsters

        - type: videos
          channels:
            - UCsBjURrPoezykLs9EqgamOA # Fireship
            - UCBJycsmduvYEL83R_U4JriQ # Marques Brownlee
            - UCXuqSBlHAE6Xw-yeJA0Tunw # Linus Tech Tips
            - UCHnyfMqiRRG1u-2MsSQLbXA # Veritasium

    - size: small
      widgets:
        - type: rss
          title: Reading
          limit: 10
          collapse-after: 4
          cache: 12h
          feeds:
            - url: https://www.rappler.com/feed/
              title: Rappler
            - url: https://www.theverge.com/rss/index.xml
              title: The Verge
            - url: https://selfh.st/rss/
              title: selfh.st
            - url: https://www.joshwcomeau.com/rss.xml
              title: Josh Comeau

        - type: releases
          cache: 1d
          # Unauthenticated GitHub API allows 60 requests/hour. To raise it, add a
          # `token:` line here (see the README for how to supply it as a Fly secret).
          repositories:
            - glanceapp/glance
            - daltonmenezes/aura-theme
            - vercel/next.js
