# Fly.io config. Change `app` to a globally unique name before the first deploy.
app = "aura-glance"
primary_region = "sin"   # Singapore, closest region to Manila

[build]
  dockerfile = "Dockerfile"

[env]
  TZ = "Asia/Manila"

[http_service]
  internal_port = 8080
  force_https = true
  # Keep one machine running so Glance's in-memory cache stays warm
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
